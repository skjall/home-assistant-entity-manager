name: Claude Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude Code Review
        id: claude
        # Run on every human PR, or when a human writes "@claude" in a comment.
        # Skip bot-initiated events (e.g. Renovate): the action refuses bot actors,
        # and dependency bumps don't need an AI review.
        #
        # Skip PRs from forks: GitHub withholds repository secrets and refuses
        # `id-token: write` for `pull_request` events raised from a fork, so
        # CLAUDE_CODE_OAUTH_TOKEN is empty and the step can only fail. Review those
        # by commenting "@claude" on the PR instead -- `issue_comment` runs in this
        # repository's context and does receive the secret.
        #
        # The condition sits on this step and not on the job: the job is a required
        # status check, and a skipped job never reports one, which would block every
        # bot and fork PR from merging for good.
        if: |
          (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude'))
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review the changes in this pull request. Focus on:
            - Correctness bugs and regressions
            - Security concerns (this add-on talks to Home Assistant via tokens/WebSocket)
            - Adherence to the conventions in CONTRIBUTING.md (type hints, docstrings,
              Black 120-char line length, English log messages, English PR text)
            Post concise inline comments on the specific lines that need attention.
            Skip nitpicks; only raise findings worth acting on.
            Ignore lock files and generated/built artifacts (package-lock.json,
            anything under static/) — review only hand-written source changes.

            When you are done, write the file review-verdict.txt in the repository
            root, and write nothing into it but one of these two words:
              CLEAN   - nothing worth acting on
              FINDINGS - you raised at least one comment above
            The merge is held on that word, so write it last, once, and only after
            the comments are posted.
          # Without an explicit allow-list the run ends in permission denials:
          # Claude reviews, reaches for the tools that would post, is refused,
          # and the action still reports success. The PR then shows nothing.
          # These are the tools it needs to say what it found -- and no more,
          # so it can neither approve nor push.
          #
          # Swap to claude-opus-4-8 for deeper reviews at higher quota cost.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 100
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,Write"
          # A denied tool call is the one thing this workflow keeps getting
          # wrong, and by default the log does not say which call was denied or
          # what Claude meant to write. The run then looks like a success with
          # an empty PR. With the full output the transcript is in the job log,
          # so the next denial can be read instead of guessed at.
          show_full_output: true

      # A review nobody has to act on is a review that changes nothing. The
      # verdict decides the check, so a PR with open findings cannot merge
      # until they are dealt with and the run repeats.
      - name: Hold the merge when the review found something
        run: |
          # No execution file means Claude never started: the step was skipped
          # by its own condition (a bot or a fork), or the action refused to run
          # because the workflow file in this PR differs from the one on the
          # default branch -- it will not let a PR rewrite the reviewer that
          # judges it, and it reports success after doing nothing.
          #
          # There is no review to gate in either case, and this job is a required
          # check: failing here would hold those PRs for a review that was never
          # allowed to happen.
          if [ -z "${{ steps.claude.outputs.execution_file }}" ]; then
            echo "Claude did not run -- skipped by condition, or the action"
            echo "refused a PR that edits its own workflow. Nothing to gate."
            exit 0
          fi
          if [ ! -f review-verdict.txt ]; then
            echo "The review left no verdict. Treating that as unreviewed."
            exit 1
          fi
          verdict=$(tr -d '[:space:]' < review-verdict.txt)
          case "$verdict" in
            CLEAN)
              echo "Review found nothing worth acting on."
              ;;
            FINDINGS)
              echo "The review raised findings. They are on the PR as comments."
              exit 1
              ;;
            *)
              echo "Unexpected verdict: '$verdict'"
              exit 1
              ;;
          esac
