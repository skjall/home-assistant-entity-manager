# Local checks mirroring the CI (lint + tests), plus the two things CI can only
# complain about after the fact: what a branch is called and what a commit says
# it is. Install once with:
#   python3 -m venv .venv && .venv/bin/pip install -r requirements.txt -r requirements-dev.txt -r requirements-test.txt
#   .venv/bin/pre-commit install --hook-type pre-commit --hook-type commit-msg
#
# The three revisions below are the versions in requirements-dev.txt, which is
# what the CI installs. They move together, by `pre-commit autoupdate` followed
# by the same numbers in that file - otherwise a file passes here and fails
# there, which is what happened when the hooks sat three versions behind.
# Run on all files:
#   pre-commit run --all-files
exclude: '^(venv.*|legacy|node_modules|static)/'

repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: ["--line-length=120", "--target-version=py312"]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=120"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        args:
          - "--select=E9,F63,F7,F82,E741,E722,F401,F402,F541,F841"
          - "--exclude=venv*,legacy,node_modules"

  - repo: local
    hooks:
      # The release notes are built from the commit messages, and the changelog
      # is what Home Assistant shows before an update.
      - id: commit-message
        name: the commit message says what kind of change it is
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

      - id: branch-name
        name: the branch is one to work on
        entry: python3 scripts/check_branch_name.py
        language: system
        pass_filenames: false
        always_run: true

      # The panel's behaviour lives inside the template, where a stray
      # bracket is a blank screen rather than a failing test.
      - id: template-scripts
        name: the inline scripts parse
        entry: python3 scripts/check_template_scripts.py
        language: system
        files: ^templates/.*\.html$
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: python3 scripts/run_tests.py
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
