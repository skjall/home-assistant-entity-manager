# Local checks mirroring the CI (lint + tests), plus the two things CI can only
# complain about after the fact: what a branch is called and what a commit says
# it is. Install once with:
#   pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type commit-msg
# Run on all files:
#   pre-commit run --all-files
exclude: '^(venv.*|legacy|node_modules|static)/'

repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length=120", "--target-version=py312"]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile=black", "--line-length=120"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args:
          - "--select=E9,F63,F7,F82,E741,E722,F401,F402,F541,F841"
          - "--exclude=venv*,legacy,node_modules"

  - repo: local
    hooks:
      # The release notes are built from the commit messages, and the changelog
      # is what Home Assistant shows before an update.
      - id: commit-message
        name: the commit message says what kind of change it is
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

      - id: branch-name
        name: the branch is one to work on
        entry: python3 scripts/check_branch_name.py
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
